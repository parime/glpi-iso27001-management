# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, cibles de notification, restes après désinstallation, secrets
# (Gitleaks), dépendances (Trivy, Dependency Review), CodeQL, mise à jour depuis la version publiée,
# tests d'intégration en français et parcours de toutes les pages (GLPI 11 et 12).
name: Sécurité commune

on:
  # Push : seulement les branches principales ; les branches de travail sont contrôlées par leur
  # PR. Évite deux exécutions (et deux notifications d'échec) pour chaque commit d'une PR.
  push:
    branches: [main, dev]
  pull_request:
  # Lancement manuel possible (onglet Actions), par exemple pour revérifier une branche.
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit sur une pull request annule l'exécution précédente de cette PR (coord/ci_ok.py
# ne regarde que le dernier commit). Push sur main ou dev, planification, lancement manuel et
# publication : un groupe par exécution (run_id), jamais annulés.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@feat/45-parcours-tranches
    with:
      plugin-key: grcmanager
      security-ref: feat/45-parcours-tranches
      # Contrôles lourds (vrai GLPI : onglets et notifications, intégration en français, mise à
      # jour, parcours des pages) seulement si la PR touche autre chose que la documentation ; tout
      # tourne sur les push (main, dev) et les publications. Même liste que le job detect de ci.yml.
      heavy-paths: '* !docs/* !changes/* !*.md !*.png !*.jpg !*.jpeg !*.gif !*.svg !*.webp'
      # Charte commune bloquante : licence, en-têtes, documentation et langues conformes (#655, #660).
      charter-mode: error
      seed-command: php plugins/grcmanager/tests/security/setup.php
      # Passe des tests d'intégration en français : même commande que ci.yml, avec la mémoire que la
      # génération des PDF (dompdf) demande ; l'image GLPI du workflow commun s'arrête à 256 Mo.
      integration-command: php -d memory_limit=1G vendor/bin/phpunit -c phpunit-integration.xml.dist
      # Contrôle d'ergonomie (réglages, menus, en-têtes) et parcours de toutes les pages bloquants
      # (valeur par défaut du workflow commun) depuis la fin de la refonte de la navigation (#1114) ;
      # écarts justifiés dans .glpi-security-exceptions.d/1114-parcours-pages.
      translated-assertions-mode: error
      # Administrateur, puis le lecteur de l'entité A créé par tests/security/setup.php
      # (SECURITY_TEST_PASSWORD).
      pages-accounts: 'glpi:glpi iso-lecteur:Secrev#2026'
      # Durée du parcours (environ 1 650 pages) : le workflow commun n'a pas d'entrée de durée ; le
      # job garde la limite de GitHub (360 min) et le parcours s'arrête à 1 500 pages par compte.
