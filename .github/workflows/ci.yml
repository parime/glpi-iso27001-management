name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Permet a release.yml de forcer l'execution de la CI sur une branche creee via GITHUB_TOKEN
  # (ex: la PR de mise a jour automatique du catalogue marketplace) -- un push/PR effectue avec
  # le GITHUB_TOKEN par defaut ne declenche pas ces triggers (garde-fou anti-boucle GitHub
  # Actions), seul un declenchement explicite via workflow_dispatch les contourne.
  workflow_dispatch:
  # Filet de securite quotidien (meme choix qu'assetsign-glpi) : detecte une regression qui ne vient
  # pas de ce depot - nouvelle image GLPI, avis de securite publie apres coup sur une dependance - sans
  # attendre le prochain push. Ecart constate le 8 octobre 2026 sur Configuration-glpi-auto, casse par
  # une mise a jour de l'image GLPI 11 sans qu'aucun push ne l'ait revele.
  schedule:
    - cron: '29 3 * * *'

permissions:
  contents: read

jobs:
  detect:
    name: Detect project state
    runs-on: ubuntu-latest
    outputs:
      has_composer: ${{ steps.check.outputs.has_composer }}
      has_lockfiles: ${{ steps.check.outputs.has_lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Detect presence of PHP/JS manifests
        id: check
        run: |
          if [ -f composer.json ]; then
            echo "has_composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_composer=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f composer.lock ] || [ -f package-lock.json ]; then
            echo "has_lockfiles=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfiles=false" >> "$GITHUB_OUTPUT"
          fi

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Validate plugin.json is valid JSON
        run: python3 -c "import json; json.load(open('plugin.json'))"

      - name: Check required community files are present
        run: |
          missing=0
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md ROADMAP.md SUPPORT.md GOVERNANCE.md MAINTAINERS.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    # Le CLI gitleaks est appele directement sur la plage de commits de la PR (pas gitleaks-action,
    # qui appelle l'API GitHub pulls.listFiles et echoue systematiquement "403 Resource not
    # accessible by integration" sur toute PR Dependabot : GitHub plafonne le GITHUB_TOKEN en
    # lecture seule pour ce type de PR, quoi que le workflow demande dans son bloc `permissions`).
    # Lecon reprise du plugin jumeau glpi-vulnerability-manager (meme auteur), deja corrigee la-bas
    # en conditions reelles, appliquee ici des le premier commit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
        with:
          fetch-depth: 0
      - name: Scanne les secrets sur la plage de commits de la PR
        run: |
          docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --exit-code 1

  sast-scan:
    name: Static security analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      # Pas de `continue-on-error` : avec, ce job restait vert quoi que Semgrep trouve (meme erreur
      # deja corrigee sur les plugins jumeaux).
      - run: semgrep ci --config auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      # Regles propres aux plugins GLPI (.semgrep/) : droit global vs droit + entite, entites lues
      # dans la requete, |raw Twig. Bloquant (--error), local : sans token ni registre en ligne.
      - name: Semgrep - regles securite GLPI du projet
        run: semgrep scan --config .semgrep/ --error --metrics=off
      # Chaque point d'entree front/ajax doit appeler un controle d'autorisation explicite, ou
      # figurer avec sa justification dans .github/security-entrypoints-allowlist.txt.
      - name: Points d'entree - controle d'autorisation present
        run: sh .github/scripts/check-entrypoints-auth.sh

  # Bloque une PR qui ajoute ou met a jour une dependance (composer, actions) ayant un avis de
  # securite connu - avant la fusion, la ou Dependabot ne previent qu'apres coup.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (SHA pinned)
        with:
          fail-on-severity: moderate

  php-quality:
    name: PHP quality (syntax, PHPStan, PHPCS)
    needs: detect
    if: needs.detect.outputs.has_composer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (SHA pinned)
        with:
          php-version: "8.2"
          coverage: none

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: PHP syntax check
        run: find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs

  locales:
    name: Locale completeness
    needs: detect
    if: needs.detect.outputs.has_composer == 'true'
    runs-on: ubuntu-latest
    # Catches a __()/_n()/_x() string added to the code without a matching entry in
    # locales/*.po — the exact gap that let ~38 strings (menu title, security-incident absorbed
    # module, config toggles, dashboard cards, training evaluation) sit with NO translation entry
    # at all in either shipped language (fr_FR/en_GB) for whole sprints before a manual audit
    # found them — distinct from the already-documented TECH_DEBT.md item about the absorbed
    # module only shipping 2 of the sibling plugin's original 5 languages, which this job does
    # not address. Regenerates the .pot from the current code (vendor/bin/extract-locales, same
    # tool a human contributor would run by hand) rather than a hand-rolled regex.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (SHA pinned)
        with:
          php-version: "8.2"
          coverage: none

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      - name: Regenerate .pot from current code
        run: |
          vendor/bin/extract-locales
          # extract-locales' own last step overwrites en_GB.po from scratch via msginit (French
          # msgid copied as a placeholder msgstr for every string, wiping real English
          # translations) - undo that so en_GB.po is checked the same way as fr_FR.po, not
          # blindly regenerated.
          git checkout -- locales/en_GB.po

      - name: Check every language has a translation for every extracted string
        run: |
          status=0
          for lang in fr_FR en_GB; do
            msgmerge --no-fuzzy-matching --quiet -o /tmp/merged_${lang}.po locales/${lang}.po locales/grcmanager.pot
            missing=$(msgattrib --untranslated /tmp/merged_${lang}.po | grep -c '^msgid "[^"]' || true)
            if [ "$missing" -gt 0 ]; then
              echo "::error::${lang}.po is missing ${missing} translation(s) for strings present in the code"
              msgattrib --untranslated /tmp/merged_${lang}.po | grep '^msgid "[^"]'
              status=1
            fi
          done
          exit $status

  tests:
    name: Automated tests (PHPUnit)
    needs: detect
    if: needs.detect.outputs.has_composer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (SHA pinned)
        with:
          php-version: "8.2"
          coverage: none

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit (unit tests)
        run: vendor/bin/phpunit --testsuite unit

  dependency-scan:
    name: Dependency vulnerability scan (Trivy)
    needs: detect
    if: needs.detect.outputs.has_lockfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA pinned, pas @master)
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  real-glpi-install:
    name: Installation reelle sur GLPI (Docker)
    # Ne remplace pas les tests unitaires (job "tests" ci-dessus) : verifie ce qu'eux ne peuvent
    # pas couvrir, a savoir que setup.php/hook.php/l'installeur fonctionnent reellement contre un
    # GLPI qui boot pour de vrai. Approche et commandes reprises du plugin jumeau
    # glpi-vulnerability-manager (meme auteur), deja validees manuellement contre glpi/glpi:11.0.11.
    needs: detect
    if: needs.detect.outputs.has_composer == 'true'
    runs-on: ubuntu-latest
    env:
      GLPI_IMAGE: glpi/glpi:11.0.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Demarre MariaDB
        run: |
          docker network create grcmanager-ci
          docker run -d --name mariadb --network grcmanager-ci \
            -e MARIADB_ROOT_PASSWORD=glpi_password \
            -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user \
            -e MARIADB_PASSWORD=glpi_password \
            mariadb:11

          echo "Attente que MariaDB accepte les connexions..."
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done

      - name: Demarre GLPI (auto-installation via l'image officielle)
        run: |
          docker run -d --name glpi --network grcmanager-ci -p 8080:80 \
            -e TIMEZONE=Europe/Paris \
            -e GLPI_DB_HOST=mariadb \
            -e GLPI_DB_PORT=3306 \
            -e GLPI_DB_NAME=glpidb \
            -e GLPI_DB_USER=glpi_user \
            -e GLPI_DB_PASSWORD=glpi_password \
            "$GLPI_IMAGE"

          echo "Attente que l'auto-installation de GLPI soit terminee..."
          ready=0
          for i in $(seq 1 60); do
            docker exec glpi test -f /var/glpi/config/config_db.php && { ready=1; break; }
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::GLPI n'a jamais termine son auto-installation (config_db.php absent)."
            docker logs glpi --tail 200
            exit 1
          fi

      - name: Copie le plugin dans le conteneur GLPI
        run: |
          docker exec glpi mkdir -p /var/www/glpi/plugins/grcmanager
          docker cp ./. glpi:/var/www/glpi/plugins/grcmanager
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/grcmanager

      - name: Installe les dependances de production du plugin
        run: |
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            mkdir -p "$COMPOSER_HOME"
            cd /tmp
            php -r "copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");"
            php composer-setup.php --install-dir=/tmp --filename=composer.phar
          '
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            cd /var/www/glpi/plugins/grcmanager
            php /tmp/composer.phar install --no-interaction --prefer-dist --no-dev
          '

      - name: database:update (idempotent, absorbe la fin de l'auto-installation)
        run: |
          ready=0
          for i in $(seq 1 12); do
            if docker exec glpi php bin/console database:update --force --no-interaction; then
              ready=1
              break
            fi
            echo "database:update pas encore pret (tentative $i/12), nouvel essai dans 5s..."
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::database:update a echoue apres 12 tentatives."
            exit 1
          fi

      - name: Installe, active puis desinstalle le plugin (cycle complet), puis le reinstalle
        run: |
          docker exec glpi php bin/console plugin:install grcmanager --force --no-interaction
          docker exec glpi php bin/console plugin:activate grcmanager --no-interaction
          docker exec glpi php bin/console plugin:list --no-interaction
          docker exec glpi php bin/console plugin:deactivate grcmanager --no-interaction
          docker exec glpi php bin/console plugin:uninstall grcmanager --no-interaction
          docker exec glpi php bin/console plugin:install grcmanager --force --no-interaction
          docker exec glpi php bin/console plugin:activate grcmanager --no-interaction

      - name: Suite d'integration sur GLPI 11
        # Jusqu'au 8 octobre 2026, la suite d'integration ne tournait que sur GLPI 12 : la version
        # principale du plugin n'etait verifiee que par le cycle installation/desinstallation
        # ci-dessus. Dependances de dev installees APRES les commandes console, meme precaution que
        # le job GLPI 12 (collision possible avec la symfony/console de GLPI).
        run: |
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            cd /var/www/glpi/plugins/grcmanager
            php /tmp/composer.phar install --no-interaction --prefer-dist
            php vendor/bin/phpunit -c phpunit-integration.xml.dist
          '

      # Test de controle d'acces de bout en bout (vraies requetes HTTP, vraie session) : un
      # gestionnaire et un lecteur limites a l'entite A ne doivent rien lire ni modifier de
      # l'entite B (incidents, revues d'acces, contrats, actifs), le lecteur ne peut pas s'assigner
      # un incident, enregistrer un risque ne doit pas effacer ses liens vers des actifs que
      # l'utilisateur ne voit pas, et un demandeur ne peut pas approuver sa propre SoA. Le
      # super-admin garde l'acces a tout.
      - name: Matrice de controle d'acces (profils limites a une entite, puis super-admin)
        run: |
          # bin/console tourne en root plus haut : rend files/ a Apache (www-data).
          docker exec -u root glpi chown -R www-data:www-data /var/glpi/files
          setup() { docker exec -u www-data glpi php /var/www/glpi/plugins/grcmanager/tests/security/setup.php "$@" | tail -1; }
          ids=$(setup); echo "$ids"
          bash tests/security/access-matrix.sh http://localhost:8080 limited iso-gestionnaire 'Secrev#2026' "$ids"
          links=$(setup risk-links "$(jq -r .risk <<< "$ids")")
          jq -e --arg b "Computer:$(jq -r .computer_B <<< "$ids")" 'index($b) != null' <<< "$links" > /dev/null \
            || { echo "::error::enregistrer le risque a efface le lien vers un actif invisible pour l'utilisateur : $links"; exit 1; }
          approvers=$(setup soa-approvers)
          jq -e --argjson me "$(jq -r .manager <<< "$ids")" '.approvers | index($me) == null' <<< "$approvers" > /dev/null \
            || { echo "::error::le demandeur s'est designe approbateur de sa propre SoA : $approvers"; exit 1; }
          echo "OK  liens du risque conserves ($links), demandeur absent des approbateurs ($approvers)"
          bash tests/security/access-matrix.sh http://localhost:8080 reader iso-lecteur 'Secrev#2026' "$ids"
          bash tests/security/access-matrix.sh http://localhost:8080 admin glpi glpi "$ids"

      - name: Logs GLPI (en cas d'echec)
        if: failure()
        run: docker logs glpi --tail 200

  php-compat:
    name: "Compatibilite PHP 8.2-8.5 x GLPI 11/12 (chargement des classes)"
    # Les jobs d'installation reelle tournent sur la seule version de PHP de l'image GLPI officielle
    # (8.5) : c'est ainsi qu'un mecanisme de compatibilite fonctionnant uniquement en PHP 8.5 (traits
    # redeclarant une propriete heritee, erreur fatale ou valeur partagee avec le parent en 8.2-8.4)
    # est passe inapercu. Ce job charge chaque classe heritant d'une classe Compat Base sur le vrai
    # coeur GLPI, sous chaque version de PHP supportee par chaque version de GLPI, et verifie que
    # chaque propriete redeclaree a sa propre valeur sans toucher au coeur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Extrait le code de GLPI 11 et GLPI 12 des images officielles
        run: |
          for v in 11.0.11 12.0.0; do
            docker create --name "glpi-$v" "glpi/glpi:$v"
            mkdir -p "/tmp/glpi-$v"
            docker cp "glpi-$v:/var/www/glpi/src" "/tmp/glpi-$v/src"
            docker cp "glpi-$v:/var/www/glpi/vendor" "/tmp/glpi-$v/vendor"
          done

      - name: Charge les classes du plugin sur chaque combinaison PHP x GLPI
        # GLPI 11 : PHP 8.2 a 8.5 ; GLPI 12 : PHP 8.3 a 8.5.
        run: |
          status=0
          for combo in "8.2 11.0.11" "8.3 11.0.11" "8.4 11.0.11" "8.5 11.0.11" \
                       "8.3 12.0.0" "8.4 12.0.0" "8.5 12.0.0"; do
            set -- $combo
            docker run --rm -v "$PWD:/p" -v "/tmp/glpi-$2:/g" "php:$1-cli" \
              php /p/.github/scripts/compat-smoke.php /g /p || status=1
          done
          exit $status

  real-glpi12-install:
    name: Installation reelle sur GLPI 12 (Docker)
    # Meme cycle que le job ci-dessus, sur GLPI 12 (cf. src/Compatibility/), plus la suite
    # d'integration : sans ce job, la compatibilite GLPI 12 pourrait regresser silencieusement.
    # Job separe plutot qu'une matrice : une matrice renommerait le check existant.
    needs: detect
    if: needs.detect.outputs.has_composer == 'true'
    runs-on: ubuntu-latest
    env:
      GLPI12_IMAGE: glpi/glpi:12.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: Demarre MariaDB
        run: |
          docker network create grcmanager-ci
          docker run -d --name mariadb --network grcmanager-ci \
            -e MARIADB_ROOT_PASSWORD=glpi_password \
            -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user \
            -e MARIADB_PASSWORD=glpi_password \
            mariadb:11
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done

      - name: Demarre GLPI 12 et installe sa base
        run: |
          docker run -d --name glpi --network grcmanager-ci -e TIMEZONE=Europe/Paris "$GLPI12_IMAGE"
          for i in $(seq 1 12); do
            docker exec glpi php bin/console database:install --db-host=mariadb --db-name=glpidb \
              --db-user=glpi_user --db-password=glpi_password --no-interaction && exit 0
            echo "database:install pas encore pret (tentative $i/12), nouvel essai dans 5s..."
            sleep 5
          done
          exit 1

      - name: Copie le plugin et installe ses dependances de production
        run: |
          docker exec glpi mkdir -p /var/www/glpi/plugins/grcmanager
          docker cp ./. glpi:/var/www/glpi/plugins/grcmanager
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/grcmanager
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            mkdir -p "$COMPOSER_HOME"
            cd /tmp
            php -r "copy(\"https://getcomposer.org/installer\", \"composer-setup.php\");"
            php composer-setup.php --install-dir=/tmp --filename=composer.phar
            cd /var/www/glpi/plugins/grcmanager
            php /tmp/composer.phar install --no-interaction --prefer-dist --no-dev
          '

      - name: Installe, active puis desinstalle le plugin (cycle complet), puis le reinstalle
        run: |
          docker exec glpi php bin/console plugin:install grcmanager --username=glpi --no-interaction
          docker exec glpi php bin/console plugin:activate grcmanager --no-interaction
          docker exec glpi php bin/console plugin:deactivate grcmanager --no-interaction
          docker exec glpi php bin/console plugin:uninstall grcmanager --no-interaction
          docker exec glpi php bin/console plugin:install grcmanager --username=glpi --no-interaction
          docker exec glpi php bin/console plugin:activate grcmanager --no-interaction

      - name: Suite d'integration sur GLPI 12
        # Dependances de dev APRES toutes les commandes console : elles embarquent leur propre
        # symfony/console, incompatible avec celui de GLPI 12 (collision d'autoload constatee en
        # local, la console GLPI planterait).
        run: |
          docker exec glpi sh -c '
            export COMPOSER_HOME=/tmp/composer-home
            cd /var/www/glpi/plugins/grcmanager
            php /tmp/composer.phar install --no-interaction --prefer-dist
            php vendor/bin/phpunit -c phpunit-integration.xml.dist
          '

      - name: PHPStan contre les sources de GLPI 12 (méthodes du cœur supprimées)
        run: docker exec glpi sh -c 'cd /var/www/glpi/plugins/grcmanager && php vendor/bin/phpstan analyse -c phpstan.glpi12.neon --no-progress --memory-limit=2G'

      - name: Logs GLPI (en cas d'echec)
        if: failure()
        run: docker logs glpi --tail 200
